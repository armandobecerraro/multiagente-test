name: SMAGESCI CI/CD

on:
  push:
    branches: [ master, main, 'feature/**', 'copilot/**' ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Build
      run: ./gradlew assemble
    
    - name: Run Unit Tests
      run: ./gradlew test
    
    - name: Generate Test Report
      if: always()
      run: ./gradlew jacocoTestReport || true
    
    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: build/reports/tests/
    
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts
        path: build/libs/

  integration-test:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: supply_chain
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Run Integration Tests
      env:
        DB_URL: jdbc:postgresql://localhost:5432/supply_chain
        DB_USERNAME: postgres
        DB_PASSWORD: test_password_ci
      run: ./gradlew test --tests "*IntegrationTest*" || ./gradlew test
